name: Format portfolio showcase once
on:
  push:
    branches: [refresh-project-showcase]
    paths: ['.github/workflows/format-project-showcase.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'risbh19/Portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed portfolio files
        run: npx prettier --write README.md dist/content.js dist/index.html dist/project-slides.js scripts/check.mjs
      - name: Commit formatting only when necessary
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md dist/content.js dist/index.html dist/project-slides.js scripts/check.mjs
          git commit -m 'Format portfolio showcase files'
          git push origin HEAD:refresh-project-showcase
