name: Format portfolio polish once
on:
  push:
    branches: [polish-portfolio-experience]
    paths: ['.github/workflows/format-portfolio-polish.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'risbh19/Portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed content and checks
        run: npx prettier --write dist/index.html scripts/check.mjs
      - name: Commit formatting changes
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/index.html scripts/check.mjs
          git commit -m 'Format portfolio polish files'
          git push origin HEAD:polish-portfolio-experience
